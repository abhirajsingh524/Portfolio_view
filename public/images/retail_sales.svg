<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="salesBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1821" />
      <stop offset="50%" stop-color="#1e2a38" />
      <stop offset="100%" stop-color="#050a0e" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#salesBg)" rx="16" />

  <!-- Sales Analytics Bar Chart -->
  <g transform="translate(100, 200)">
    <!-- Axis lines -->
    <line x1="0" y1="160" x2="320" y2="160" stroke="#64748b" stroke-width="1.5" />
    <line x1="0" y1="0" x2="0" y2="160" stroke="#64748b" stroke-width="1.5" />
    <!-- Bars -->
    <rect x="25" y="80" width="30" height="80" rx="4" fill="url(#barGrad)" />
    <rect x="75" y="50" width="30" height="110" rx="4" fill="url(#barGrad)" />
    <rect x="125" y="95" width="30" height="65" rx="4" fill="url(#barGrad)" />
    <rect x="175" y="30" width="30" height="130" rx="4" fill="url(#barGrad)" />
    <rect x="225" y="60" width="30" height="100" rx="4" fill="url(#barGrad)" />
    <rect x="275" y="20" width="30" height="140" rx="4" fill="#10b981" />
    <!-- Forecast Line -->
    <path d="M 40 80 Q 90 40, 140 95 T 240 50 T 290 20" fill="none" stroke="#38bdf8" stroke-width="2.5" />
  </g>

  <!-- Metric KPI Cards -->
  <g transform="translate(480, 160)">
    <rect width="220" height="70" rx="8" fill="rgba(30, 41, 59, 0.8)" stroke="#f59e0b" stroke-width="1" />
    <text x="16" y="26" fill="#94a3b8" font-family="monospace" font-size="10">SALES PREDICTION ACCURACY</text>
    <text x="16" y="54" fill="#fbbf24" font-family="monospace" font-size="20" font-weight="bold">R² = 0.89</text>
  </g>

  <g transform="translate(480, 250)">
    <rect width="220" height="70" rx="8" fill="rgba(30, 41, 59, 0.8)" stroke="#10b981" stroke-width="1" />
    <text x="16" y="26" fill="#94a3b8" font-family="monospace" font-size="10">REVENUE FORECAST (Q4)</text>
    <text x="16" y="54" fill="#34d399" font-family="monospace" font-size="20" font-weight="bold">+14.2% LIFT</text>
  </g>

  <!-- Header -->
  <text x="40" y="50" fill="#fbbf24" font-family="monospace" font-size="14" font-weight="bold" letter-spacing="2">RETAIL SALES ANALYTICS &amp; PREDICTION</text>
  <text x="40" y="75" fill="#94a3b8" font-family="monospace" font-size="11">PANDAS • SCIKIT-LEARN • REGRESSION FORECASTING • TABLEAU KPI</text>

  <rect x="40" y="440" width="250" height="34" rx="8" fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b" stroke-width="1" />
  <text x="55" y="462" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="bold">EDA &amp; BUSINESS INTELLIGENCE</text>

  <rect x="520" y="440" width="240" height="34" rx="8" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1" />
  <text x="535" y="462" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold">STACK: PYTHON + PANDAS + ML</text>
</svg>
