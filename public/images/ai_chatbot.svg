<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="chatBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="50%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#0b0f17" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#chatBg)" rx="16" />

  <!-- Chat Dialog Window -->
  <g transform="translate(180, 130)">
    <rect width="440" height="260" rx="12" fill="rgba(15, 23, 42, 0.9)" stroke="#6366f1" stroke-width="1.5" />
    
    <!-- User Message Bubble -->
    <rect x="180" y="30" width="230" height="40" rx="10" fill="#6366f1" />
    <text x="195" y="55" fill="#f8fafc" font-size="12">How does RAG semantic search work?</text>

    <!-- Bot Response Bubble -->
    <rect x="30" y="90" width="280" height="70" rx="10" fill="#334155" />
    <text x="45" y="115" fill="#f8fafc" font-size="12">It embeds queries into vector space,</text>
    <text x="45" y="135" fill="#cbd5e1" font-size="11">retrieves nearest neighbors via FAISS,</text>
    <text x="45" y="152" fill="#cbd5e1" font-size="11">and injects context into the LLM prompt.</text>

    <!-- Intent / Memory Status Bar -->
    <rect x="30" y="185" width="380" height="40" rx="6" fill="rgba(99, 102, 241, 0.15)" stroke="#4f46e5" stroke-width="1" />
    <text x="45" y="210" fill="#a5b4fc" font-family="monospace" font-size="10">INTENT: TECHNICAL_EXPLANATION • CONTEXT MEMORY: RETAINED</text>
  </g>

  <!-- Header -->
  <text x="40" y="50" fill="#a5b4fc" font-family="monospace" font-size="14" font-weight="bold" letter-spacing="2">AI CHATBOT // CONVERSATIONAL INTELLIGENCE</text>
  <text x="40" y="75" fill="#94a3b8" font-family="monospace" font-size="11">NLP • INTENT CLASSIFICATION • CONVERSATIONAL CONTEXT MEMORY</text>

  <rect x="40" y="440" width="220" height="34" rx="8" fill="rgba(99, 102, 241, 0.15)" stroke="#6366f1" stroke-width="1" />
  <text x="55" y="462" fill="#a5b4fc" font-family="monospace" font-size="11" font-weight="bold">CATEGORY: GENERATIVE AI</text>

  <rect x="520" y="440" width="240" height="34" rx="8" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1" />
  <text x="535" y="462" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">CLEAN INTERVIEW DEMO</text>
</svg>
