<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cvBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a121d" />
      <stop offset="50%" stop-color="#111e33" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#cvBg)" rx="16" />

  <!-- Roadway Perspective lines -->
  <polygon points="340,160 460,160 700,420 100,420" fill="rgba(30, 41, 59, 0.4)" stroke="#475569" stroke-width="1" />
  <line x1="400" y1="160" x2="400" y2="420" stroke="#facc15" stroke-width="2" stroke-dasharray="16 12" />

  <!-- Bounding Box 1: Car Detected -->
  <g transform="translate(180, 240)">
    <rect width="180" height="120" fill="none" stroke="#22c55e" stroke-width="2" rx="4" />
    <!-- Bounding Box Corner Brackets -->
    <path d="M 0 15 L 0 0 L 15 0" stroke="#4ade80" stroke-width="3" fill="none" />
    <path d="M 165 0 L 180 0 L 180 15" stroke="#4ade80" stroke-width="3" fill="none" />
    <path d="M 0 105 L 0 120 L 15 120" stroke="#4ade80" stroke-width="3" fill="none" />
    <path d="M 165 120 L 180 120 L 180 105" stroke="#4ade80" stroke-width="3" fill="none" />
    <!-- Label -->
    <rect x="0" y="-22" width="130" height="22" fill="#22c55e" rx="3" />
    <text x="8" y="-7" fill="#052e16" font-family="monospace" font-size="11" font-weight="bold">CAR: 94.6% CONF</text>
    <!-- Tracking Vector Point -->
    <circle cx="90" cy="60" r="5" fill="#4ade80" />
    <line x1="90" y1="60" x2="130" y2="30" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="3 3" />
  </g>

  <!-- Bounding Box 2: Truck/Van Detected -->
  <g transform="translate(440, 200)">
    <rect width="160" height="150" fill="none" stroke="#06b6d4" stroke-width="2" rx="4" />
    <rect x="0" y="-22" width="140" height="22" fill="#06b6d4" rx="3" />
    <text x="8" y="-7" fill="#083344" font-family="monospace" font-size="11" font-weight="bold">TRUCK: 91.2% CONF</text>
    <circle cx="80" cy="75" r="5" fill="#22d3ee" />
    <line x1="80" y1="75" x2="110" y2="40" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="3 3" />
  </g>

  <!-- Header -->
  <text x="40" y="50" fill="#4ade80" font-family="monospace" font-size="14" font-weight="bold" letter-spacing="2">VEHICLE DETECTION SYSTEM // COMPUTER VISION</text>
  <text x="40" y="75" fill="#94a3b8" font-family="monospace" font-size="11">CNN ARCHITECTURE • OPENCV VIDEO PROCESSING • BOUNDING BOX TRACKING</text>

  <rect x="40" y="440" width="230" height="34" rx="8" fill="rgba(34, 197, 94, 0.15)" stroke="#22c55e" stroke-width="1" />
  <text x="55" y="462" fill="#4ade80" font-family="monospace" font-size="11" font-weight="bold">FRAMEWORK: TENSORFLOW + CNN</text>

  <rect x="520" y="440" width="240" height="34" rx="8" fill="rgba(6, 182, 212, 0.15)" stroke="#06b6d4" stroke-width="1" />
  <text x="535" y="462" fill="#22d3ee" font-family="monospace" font-size="11" font-weight="bold">TARGET: SMART TRAFFIC SURVEILLANCE</text>
</svg>
