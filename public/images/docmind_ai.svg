<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="docBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="50%" stop-color="#1c2541" />
      <stop offset="100%" stop-color="#090c15" />
    </linearGradient>
    <linearGradient id="ragFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="ragGlow">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#docBg)" rx="16" />

  <!-- Document Ingestion Stack -->
  <g transform="translate(100, 150)">
    <rect width="130" height="170" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <path d="M 0 0 L 95 0 L 130 35 L 130 170 L 0 170 Z" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <line x1="20" y1="50" x2="110" y2="50" stroke="#60a5fa" stroke-width="2" />
    <line x1="20" y1="75" x2="90" y2="75" stroke="#94a3b8" stroke-width="2" />
    <line x1="20" y1="100" x2="105" y2="100" stroke="#94a3b8" stroke-width="2" />
    <line x1="20" y1="125" x2="80" y2="125" stroke="#94a3b8" stroke-width="2" />
    <text x="18" y="152" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">PDF / DOCX</text>
  </g>

  <!-- Flow Arrows to Vector Space -->
  <path d="M 240 235 L 350 235" stroke="url(#ragFlow)" stroke-width="2.5" stroke-dasharray="6 4" filter="url(#ragGlow)" />
  <polygon points="355,235 345,230 345,240" fill="#8b5cf6" />

  <!-- FAISS Dense Vector Space Core -->
  <g transform="translate(420, 235)">
    <circle cx="0" cy="0" r="70" fill="rgba(139, 92, 246, 0.15)" stroke="#8b5cf6" stroke-width="1.5" filter="url(#ragGlow)" />
    <!-- Embedded Vectors Points -->
    <circle cx="-30" cy="-20" r="4" fill="#60a5fa" />
    <circle cx="-10" cy="30" r="4" fill="#a855f7" />
    <circle cx="25" cy="-25" r="4" fill="#ec4899" />
    <circle cx="20" cy="20" r="5" fill="#38bdf8" />
    <circle cx="-25" cy="15" r="3" fill="#2dd4bf" />
    <!-- Cosine nearest neighbor query line -->
    <line x1="-30" y1="-20" x2="20" y2="20" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="3 3" />
    <text x="-40" y="5" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold">FAISS</text>
  </g>

  <!-- Flow Arrow from Vector Space to LLM Response -->
  <path d="M 495 235 L 590 235" stroke="url(#ragFlow)" stroke-width="2.5" stroke-dasharray="6 4" filter="url(#ragGlow)" />
  <polygon points="595,235 585,230 585,240" fill="#ec4899" />

  <!-- Contextual Answer Box -->
  <g transform="translate(605, 150)">
    <rect width="140" height="170" rx="8" fill="#1e1e38" stroke="#ec4899" stroke-width="1.5" />
    <text x="15" y="30" fill="#f43f5e" font-family="monospace" font-size="11" font-weight="bold">LLM SYNTHESIS</text>
    <rect x="15" y="45" width="110" height="20" rx="4" fill="rgba(236, 72, 153, 0.2)" />
    <text x="20" y="60" fill="#fbcfe8" font-family="monospace" font-size="9">Verified Answer</text>
    <line x1="15" y1="85" x2="120" y2="85" stroke="#cbd5e1" stroke-width="2" />
    <line x1="15" y1="105" x2="105" y2="105" stroke="#cbd5e1" stroke-width="2" />
    <line x1="15" y1="125" x2="90" y2="125" stroke="#cbd5e1" stroke-width="2" />
    <text x="15" y="152" fill="#a78bfa" font-family="monospace" font-size="9">Sources Cited [1, 2]</text>
  </g>

  <!-- Header -->
  <text x="40" y="50" fill="#818cf8" font-family="monospace" font-size="14" font-weight="bold" letter-spacing="2">DOCMIND AI // INTELLIGENT DOCUMENT Q&amp;A</text>
  <text x="40" y="75" fill="#94a3b8" font-family="monospace" font-size="11">RAG ARCHITECTURE • FAISS VECTOR EMBEDDINGS • CONTEXT GROUNDING</text>

  <rect x="40" y="430" width="220" height="34" rx="8" fill="rgba(99, 102, 241, 0.15)" stroke="#6366f1" stroke-width="1" />
  <text x="55" y="452" fill="#818cf8" font-family="monospace" font-size="11" font-weight="bold">SEMANTIC CHUNKING: ACTIVE</text>

  <rect x="520" y="430" width="240" height="34" rx="8" fill="rgba(236, 72, 153, 0.15)" stroke="#ec4899" stroke-width="1" />
  <text x="535" y="452" fill="#f472b6" font-family="monospace" font-size="11" font-weight="bold">HALLUCINATION MITIGATION: YES</text>
</svg>
