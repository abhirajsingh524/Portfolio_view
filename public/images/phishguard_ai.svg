<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="phishBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140a1c" />
      <stop offset="50%" stop-color="#1f112e" />
      <stop offset="100%" stop-color="#09050d" />
    </linearGradient>
    <linearGradient id="alertGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#phishBg)" rx="16" />

  <!-- Lexical URL breakdown banner -->
  <g transform="translate(100, 130)">
    <rect width="600" height="50" rx="8" fill="rgba(15, 23, 42, 0.9)" stroke="#ef4444" stroke-width="1.5" />
    <text x="25" y="32" fill="#94a3b8" font-family="monospace" font-size="13">https://</text>
    <text x="95" y="32" fill="#ef4444" font-family="monospace" font-size="13" font-weight="bold">security-update.bank-verify.xyz</text>
    <text x="390" y="32" fill="#94a3b8" font-family="monospace" font-size="13">/auth?token=x89b</text>
    <rect x="510" y="10" width="75" height="30" rx="6" fill="#ef4444" opacity="0.3" />
    <text x="522" y="30" fill="#fca5a5" font-family="monospace" font-size="11" font-weight="bold">RISK 96%</text>
  </g>

  <!-- Feature Extraction Breakdown -->
  <g transform="translate(100, 220)">
    <rect width="260" height="160" rx="8" fill="rgba(30, 41, 59, 0.7)" stroke="#64748b" stroke-width="1" />
    <text x="18" y="28" fill="#f87171" font-family="monospace" font-size="11" font-weight="bold">EXTRACTED ML FEATURES</text>
    <text x="18" y="55" fill="#cbd5e1" font-family="monospace" font-size="11">• Domain Entropy: 4.82 (High)</text>
    <text x="18" y="80" fill="#cbd5e1" font-family="monospace" font-size="11">• Subdomain Depth: 3 (Suspicious)</text>
    <text x="18" y="105" fill="#cbd5e1" font-family="monospace" font-size="11">• IP Address Disguise: Flagged</text>
    <text x="18" y="130" fill="#cbd5e1" font-family="monospace" font-size="11">• Lexical N-Gram Anomaly: Detected</text>
  </g>

  <!-- Random Forest Classification Tree Graph -->
  <g transform="translate(420, 220)">
    <rect width="280" height="160" rx="8" fill="rgba(30, 41, 59, 0.7)" stroke="#f97316" stroke-width="1" />
    <text x="18" y="28" fill="#fb923c" font-family="monospace" font-size="11" font-weight="bold">RANDOM FOREST DECISION PATH</text>
    <!-- Decision Node Tree -->
    <circle cx="140" cy="55" r="10" fill="#f97316" />
    <line x1="140" y1="65" x2="80" y2="105" stroke="#f97316" stroke-width="1.5" />
    <line x1="140" y1="65" x2="200" y2="105" stroke="#f97316" stroke-width="1.5" />
    <circle cx="80" cy="105" r="8" fill="#eab308" />
    <circle cx="200" cy="105" r="8" fill="#ef4444" />
    <text x="50" y="140" fill="#fef08a" font-family="monospace" font-size="9">Legit: 4%</text>
    <text x="170" y="140" fill="#fca5a5" font-family="monospace" font-size="9">Phish: 96%</text>
  </g>

  <!-- Header -->
  <text x="40" y="50" fill="#f87171" font-family="monospace" font-size="14" font-weight="bold" letter-spacing="2">PHISHGUARD AI // INTELLIGENT PHISHING DETECTION</text>
  <text x="40" y="75" fill="#94a3b8" font-family="monospace" font-size="11">ML CLASSIFICATION • LEXICAL HEURISTICS • EXPLAINABLE THREAT ANALYSIS</text>

  <rect x="40" y="430" width="230" height="34" rx="8" fill="rgba(239, 68, 68, 0.15)" stroke="#ef4444" stroke-width="1" />
  <text x="55" y="452" fill="#f87171" font-family="monospace" font-size="11" font-weight="bold">CYBERSECURITY: SIH-INSPIRED</text>

  <rect x="520" y="430" width="240" height="34" rx="8" fill="rgba(249, 115, 22, 0.15)" stroke="#f97316" stroke-width="1" />
  <text x="535" y="452" fill="#fb923c" font-family="monospace" font-size="11" font-weight="bold">MODEL: RANDOM FOREST + NLP</text>
</svg>
