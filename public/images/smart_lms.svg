<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="lmsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="50%" stop-color="#092532" />
      <stop offset="100%" stop-color="#05131e" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.35" />
    </linearGradient>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#lmsBg)" rx="16" />

  <!-- UI Window card representation -->
  <rect x="70" y="80" width="660" height="340" rx="12" fill="#0d213a" stroke="#1e3a5f" stroke-width="1.5" opacity="0.9" />

  <!-- Window dots -->
  <circle cx="95" cy="105" r="4.5" fill="#ef4444" />
  <circle cx="112" cy="105" r="4.5" fill="#f59e0b" />
  <circle cx="129" cy="105" r="4.5" fill="#10b981" />
  <line x1="70" y1="125" x2="730" y2="125" stroke="#1e3a5f" stroke-width="1" />

  <!-- Mini Dashboard Columns -->
  <!-- Left Analytics Panel -->
  <rect x="95" y="145" width="180" height="85" rx="8" fill="#132c4a" stroke="#254a73" stroke-width="1" />
  <text x="110" y="170" fill="#94a3b8" font-family="monospace" font-size="10">STUDENT PROGRESSION</text>
  <text x="110" y="198" fill="#38ef7d" font-family="monospace" font-size="20" font-weight="bold">94.2%</text>
  <rect x="110" y="212" width="150" height="6" rx="3" fill="#1e3a5f" />
  <rect x="110" y="212" width="138" height="6" rx="3" fill="#38ef7d" />

  <!-- Recommendation AI Panel -->
  <rect x="95" y="245" width="180" height="150" rx="8" fill="#132c4a" stroke="#254a73" stroke-width="1" />
  <text x="110" y="270" fill="#94a3b8" font-family="monospace" font-size="10">AI RECOMMENDATIONS</text>
  <rect x="110" y="285" width="150" height="26" rx="4" fill="#1a3d66" />
  <text x="120" y="302" fill="#67e8f9" font-family="sans-serif" font-size="10">▸ Course: Deep Learning</text>
  <rect x="110" y="320" width="150" height="26" rx="4" fill="#1a3d66" />
  <text x="120" y="337" fill="#67e8f9" font-family="sans-serif" font-size="10">▸ Module: Transformer Attn</text>
  <rect x="110" y="355" width="150" height="26" rx="4" fill="#1a3d66" />
  <text x="120" y="372" fill="#67e8f9" font-family="sans-serif" font-size="10">▸ Quiz: Predictive Analytics</text>

  <!-- Right Performance Curve & Knowledge Graph -->
  <rect x="295" y="145" width="415" height="250" rx="8" fill="#112742" stroke="#254a73" stroke-width="1" />
  <text x="315" y="175" fill="#94a3b8" font-family="monospace" font-size="11">PREDICTIVE LEARNING RETENTION GRAPH</text>

  <!-- Chart Grid -->
  <g stroke="#1a3b5c" stroke-width="1" opacity="0.6">
    <line x1="315" y1="210" x2="690" y2="210" />
    <line x1="315" y1="260" x2="690" y2="260" />
    <line x1="315" y1="310" x2="690" y2="310" />
    <line x1="315" y1="360" x2="690" y2="360" />
  </g>

  <!-- Area under curve -->
  <path d="M 320 350 Q 380 320 440 280 T 560 210 T 680 180 L 680 360 L 320 360 Z" fill="url(#chartGrad)" />

  <!-- Smooth trend line -->
  <path d="M 320 350 Q 380 320 440 280 T 560 210 T 680 180" fill="none" stroke="#00f2fe" stroke-width="3" filter="url(#emeraldGlow)" />

  <!-- Trend dots -->
  <circle cx="320" cy="350" r="5" fill="#00f2fe" filter="url(#emeraldGlow)" />
  <circle cx="440" cy="280" r="5" fill="#00f2fe" filter="url(#emeraldGlow)" />
  <circle cx="560" cy="210" r="5" fill="#38ef7d" filter="url(#emeraldGlow)" />
  <circle cx="680" cy="180" r="6" fill="#38ef7d" filter="url(#emeraldGlow)" />

  <!-- NLP Assistant Chat Badge -->
  <g transform="translate(520, 240)">
    <rect width="170" height="70" rx="8" fill="#1b3f68" stroke="#38ef7d" stroke-width="1" opacity="0.95" filter="url(#emeraldGlow)" />
    <text x="12" y="24" fill="#38ef7d" font-family="monospace" font-size="10" font-weight="bold">NLP TUTOR ASSISTANT</text>
    <text x="12" y="44" fill="#e2e8f0" font-family="sans-serif" font-size="11">"Concept clarified: RAG"</text>
    <text x="12" y="58" fill="#94a3b8" font-family="monospace" font-size="9">Latency: 0.18s • Active</text>
  </g>

  <!-- Header and Footer tags -->
  <text x="35" y="45" fill="#38ef7d" font-family="monospace" font-size="13" letter-spacing="2">SMART LMS // ADAPTIVE EDUCATION INTELLIGENCE</text>
  <text x="35" y="465" fill="#00f2fe" font-family="monospace" font-size="11">DEPLOYMENT: RENDER PRODUCTION LIVE</text>
  <text x="610" y="465" fill="#94a3b8" font-family="monospace" font-size="11">ML ENGINE: CLUSTERING & NLP</text>
</svg>
