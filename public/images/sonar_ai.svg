<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="sonarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#110d29" />
      <stop offset="50%" stop-color="#180b2a" />
      <stop offset="100%" stop-color="#070314" />
    </linearGradient>
    <radialGradient id="nlpCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#6366f1" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#ec4899" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#sonarBg)" rx="16" />

  <!-- Sonar wave pulses -->
  <circle cx="400" cy="250" r="80" fill="none" stroke="#a855f7" stroke-width="1.2" opacity="0.8" />
  <circle cx="400" cy="250" r="140" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6" />
  <circle cx="400" cy="250" r="200" fill="none" stroke="#ec4899" stroke-width="1" stroke-dasharray="10 8" opacity="0.4" />
  <circle cx="400" cy="250" r="260" fill="none" stroke="#8b5cf6" stroke-width="0.8" opacity="0.25" />

  <!-- Transformer attention core -->
  <circle cx="400" cy="250" r="120" fill="url(#nlpCore)" filter="url(#purpleGlow)" />

  <!-- Neural attention graph nodes -->
  <!-- Left layer -->
  <circle cx="180" cy="160" r="6" fill="#a855f7" filter="url(#purpleGlow)" />
  <circle cx="180" cy="250" r="6" fill="#6366f1" filter="url(#purpleGlow)" />
  <circle cx="180" cy="340" r="6" fill="#ec4899" filter="url(#purpleGlow)" />

  <!-- Middle attention layer -->
  <circle cx="320" cy="180" r="8" fill="#8b5cf6" filter="url(#purpleGlow)" />
  <circle cx="320" cy="320" r="8" fill="#6366f1" filter="url(#purpleGlow)" />

  <!-- Center Token Embedding Matrix -->
  <circle cx="400" cy="250" r="14" fill="#f43f5e" filter="url(#purpleGlow)" />

  <!-- Output synthesis layer -->
  <circle cx="480" cy="180" r="8" fill="#6366f1" filter="url(#purpleGlow)" />
  <circle cx="480" cy="320" r="8" fill="#a855f7" filter="url(#purpleGlow)" />

  <!-- Context target nodes -->
  <circle cx="620" cy="160" r="6" fill="#ec4899" filter="url(#purpleGlow)" />
  <circle cx="620" cy="250" r="6" fill="#a855f7" filter="url(#purpleGlow)" />
  <circle cx="620" cy="340" r="6" fill="#6366f1" filter="url(#purpleGlow)" />

  <!-- Synaptic Attention Weights -->
  <g stroke-width="1.2" opacity="0.45">
    <line x1="180" y1="160" x2="320" y2="180" stroke="#a855f7" />
    <line x1="180" y1="250" x2="320" y2="180" stroke="#6366f1" />
    <line x1="180" y1="340" x2="320" y2="320" stroke="#ec4899" />
    <line x1="180" y1="250" x2="320" y2="320" stroke="#8b5cf6" />
    <line x1="320" y1="180" x2="400" y2="250" stroke="#f43f5e" stroke-width="2" opacity="0.8" />
    <line x1="320" y1="320" x2="400" y2="250" stroke="#8b5cf6" stroke-width="1.5" />
    <line x1="400" y1="250" x2="480" y2="180" stroke="#6366f1" stroke-width="2" opacity="0.8" />
    <line x1="400" y1="250" x2="480" y2="320" stroke="#a855f7" stroke-width="1.5" />
    <line x1="480" y1="180" x2="620" y2="160" stroke="#ec4899" />
    <line x1="480" y1="180" x2="620" y2="250" stroke="#a855f7" />
    <line x1="480" y1="320" x2="620" y2="250" stroke="#6366f1" />
    <line x1="480" y1="320" x2="620" y2="340" stroke="#ec4899" />
  </g>

  <!-- Vector search cosine lines -->
  <path d="M 220 120 C 350 70 450 70 580 120" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />
  <path d="M 220 380 C 350 430 450 430 580 380" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />

  <!-- Semantic Vector labels -->
  <text x="35" y="45" fill="#c084fc" font-family="monospace" font-size="13" letter-spacing="2">SONAR AI // VECTOR EMBEDDING ENGINE</text>
  <text x="35" y="70" fill="#94a3b8" font-family="monospace" font-size="11">PIPELINE: RAG ARCHITECTURE + SEMANTIC RETRIEVAL</text>
  <text x="35" y="465" fill="#a855f7" font-family="monospace" font-size="12">QUERY TO LATENT SPACE: ACTIVE</text>
  <text x="610" y="465" fill="#f43f5e" font-family="monospace" font-size="11">CTX ATTENTION: OPTIMIZED</text>
</svg>
