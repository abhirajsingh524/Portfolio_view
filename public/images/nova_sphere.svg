<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#071b26" />
      <stop offset="100%" stop-color="#040914" />
    </linearGradient>
    <radialGradient id="sphereGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#4facfe" stop-opacity="0.3" />
      <stop offset="80%" stop-color="#0b1b3d" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#38ef7d" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" rx="16" />

  <!-- Grid lines -->
  <g stroke="#1a365d" stroke-width="1" opacity="0.35">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="160" y1="0" x2="160" y2="500" />
    <line x1="320" y1="0" x2="320" y2="500" />
    <line x1="480" y1="0" x2="480" y2="500" />
    <line x1="640" y1="0" x2="640" y2="500" />
  </g>

  <!-- Central Glow Sphere -->
  <circle cx="400" cy="250" r="160" fill="url(#sphereGlow)" filter="url(#glow)" />

  <!-- Orbital Rings / Environmental rings -->
  <ellipse cx="400" cy="250" rx="220" ry="85" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6" transform="rotate(-18 400 250)" />
  <ellipse cx="400" cy="250" rx="190" ry="70" fill="none" stroke="#38ef7d" stroke-width="2" opacity="0.7" transform="rotate(32 400 250)" />
  <ellipse cx="400" cy="250" rx="140" ry="140" fill="none" stroke="#4facfe" stroke-width="1" stroke-dasharray="4 4" opacity="0.5" />

  <!-- Radar sweep wave -->
  <path d="M 400 250 L 580 180 A 200 200 0 0 0 450 60 Z" fill="#00f2fe" opacity="0.1" />

  <!-- Sensor nodes & telemetry vectors -->
  <g fill="#00f2fe">
    <circle cx="260" cy="180" r="4" filter="url(#glow)" />
    <circle cx="530" cy="210" r="5" filter="url(#glow)" />
    <circle cx="340" cy="330" r="3" />
    <circle cx="460" cy="140" r="4" filter="url(#glow)" />
    <circle cx="200" cy="280" r="3" />
    <circle cx="600" cy="310" r="4" />
  </g>

  <!-- Connective vectors -->
  <path d="M 260 180 Q 400 210 530 210 T 600 310" fill="none" stroke="#00f2fe" stroke-width="1.2" opacity="0.5" />
  <path d="M 460 140 L 340 330" fill="none" stroke="#38ef7d" stroke-width="1" stroke-dasharray="3 3" opacity="0.6" />

  <!-- Pulse circles -->
  <circle cx="400" cy="250" r="60" fill="none" stroke="#00f2fe" stroke-width="1.5" opacity="0.8" />
  <circle cx="400" cy="250" r="24" fill="#00f2fe" opacity="0.7" filter="url(#glow)" />

  <!-- Technical HUD tags -->
  <text x="35" y="45" fill="#00f2fe" font-family="monospace" font-size="13" letter-spacing="2">NOVA SPHERE // SATELLITE TELEMETRY</text>
  <text x="35" y="70" fill="#64748b" font-family="monospace" font-size="11">MODEL: PREDICTIVE DISASTER FORECASTING</text>
  <text x="35" y="465" fill="#38ef7d" font-family="monospace" font-size="12">STATUS: ANOMALY MONITORING ACTIVE</text>
  <text x="630" y="465" fill="#00f2fe" font-family="monospace" font-size="11">ACCURACY METRIC: REAL-TIME</text>

  <!-- Hexagon indicators -->
  <polygon points="720,50 740,62 740,84 720,96 700,84 700,62" fill="none" stroke="#00f2fe" stroke-width="1.5" opacity="0.7" />
  <polygon points="720,60 730,66 730,78 720,84 710,78 710,66" fill="#00f2fe" opacity="0.3" />
</svg>
